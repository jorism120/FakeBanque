server:
  port: 8083

jwt:
  secret: "change-me-change-me-change-me-change-me"

spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:9001
          predicates:
            - Path=/auth/**

        - id: bank-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/bank/**
          filters:
            - StripPrefix=2